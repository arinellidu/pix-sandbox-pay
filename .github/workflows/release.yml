name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag that cannot pass its own tests is not a release.
      - name: go test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Not everyone reaches for Docker. The binary is static and CGO-free, so
      # every one of these is a single file with nothing to install.
      - name: cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Everything is staged outside the checkout. Go stamps vcs.modified
          # from `git status`, which counts untracked files — so a build
          # directory created in the work tree makes every release binary
          # report +dirty, and a marker that is always on says nothing.
          BUILD="$RUNNER_TEMP/build"
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"

            # go build does not create the output's parent directory, and the
            # loop removes it at the end of every iteration.
            mkdir -p "$BUILD"

            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$BUILD/pix-sandbox$ext" ./cmd/pix-sandbox

            # One archive format for every target: Windows 10 and later ship
            # bsdtar, so a .zip would buy nothing and cost a dependency on the
            # runner having `zip` installed.
            name="pix-sandbox_${VERSION}_${os}_${arch}"
            cp README.md LICENSE CHANGELOG.md "$BUILD/"
            tar -czf "$DIST/$name.tar.gz" -C "$BUILD" .
            rm -rf "$BUILD"
          done

          # Name the inputs explicitly rather than globbing: checksums.txt is
          # created by the redirect and must not end up checksumming itself.
          (cd "$DIST" && sha256sum pix-sandbox_* > checksums.txt)
          ls -lh "$DIST"

          # The tree must be exactly as checked out, or the next build lies.
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "the work tree was modified by the build"; exit 1; }

          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}/*
          generate_release_notes: true
          body: |
            ```bash
            docker run -p 8080:8080 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Or take a binary below — static, CGO-free, nothing to install. Verify with `sha256sum -c checksums.txt`.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for what landed.
